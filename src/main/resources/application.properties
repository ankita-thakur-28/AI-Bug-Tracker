# Server
server.port=8080

# ?? DataSource (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aibt_db}
spring.datasource.username=${DB_USER:aibt_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? JWT (we'll use this in Task 6)
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentAndTesting12345678901234567890}
app.jwt.expiration-ms=86400000

app.ai.provider-url=${AI_PROVIDER_URL:https://api.deepseek.com/chat/completions}
app.ai.api-key=${DEEPSEEK_API_KEY}
app.ai.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
app.ai.temperature=${DEEPSEEK_TEMP:0.3}

# ?? Email / Brevo (Sprint 6)
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@aibt.dev}
app.brevo.sender-name=AIBT System

# ?? Frontend URL (used in emails & AI-generated test scripts)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ?? CORS allowed origins (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ?? Active Spring profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ?? Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50

# ?? Swagger / OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# ?? Logging
logging.level.org.springframework.security=WARN
logging.level.com.codewithankita.aibugtracker=INFO
