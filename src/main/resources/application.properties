# Server
server.port=8080

# ?? DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/aibt_db
spring.datasource.username=aibt_user
spring.datasource.password=aibt_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? JWT (we'll use this in Task 6)
app.jwt.secret=aibt_super_secret_key_change_in_production_min_256bits
app.jwt.expiration-ms=86400000

# ?? AI Provider (we'll use this in Sprint 4)
app.ai.provider-url=https://api.anthropic.com/v1/messages
app.ai.api-key=YOUR_API_KEY_HERE
app.ai.model=claude-sonnet-4-20250514
app.ai.temperature=0.3

# ?? Email / Brevo (Sprint 6)
app.brevo.api-key=YOUR_BREVO_KEY_HERE
app.brevo.sender-email=noreply@aibt.dev
app.brevo.sender-name=AIBT System

# ?? Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50

# ?? Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.codewithankita.aibugtracker=DEBUG
